# Sumber proyek Xcode. Hasilkan AudioHub.xcodeproj dengan: xcodegen generate
name: AudioHub

options:
  bundleIdPrefix: com.audiohub
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    DEVELOPMENT_TEAM: MYQ2H766UX
    CODE_SIGN_STYLE: Manual
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"

targets:
  AudioHub:
    type: application
    platform: macOS
    sources:
      - path: apps/macos/AudioHub/Sources
      - path: apps/macos/AudioHub/Assets.xcassets
      - path: engine/graph/graph.cpp
      - path: engine/graph/graph.h
      - path: engine/api/audiohub_engine.cpp
      - path: engine/api/audiohub_engine.h
      - path: engine/dsp/dsp.cpp
      - path: engine/dsp/dsp.h
      - path: backends/coreaudio/io/audiohub_io.cpp
      - path: backends/coreaudio/io/audiohub_io.h
      - path: backends/coreaudio/io/au_insert.cpp
      - path: backends/coreaudio/io/au_insert.h
    settings:
      base:
        PRODUCT_NAME: AudioHub
        PRODUCT_BUNDLE_IDENTIFIER: com.audiohub.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: apps/macos/AudioHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/macos/AudioHub/AudioHub.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: apps/macos/AudioHub/Sources/AudioHub-Bridging.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/engine/api
          - $(SRCROOT)/engine/dsp
          - $(SRCROOT)/engine/graph
          - $(SRCROOT)/backends/coreaudio/io
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/backends/coreaudio/io
        OTHER_LDFLAGS: "-lc++"
        CODE_SIGN_IDENTITY: "Developer ID Application"
      configs:
        Release:
          # Notarisasi menolak tanda tangan tanpa secure timestamp.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: apps/macos/AudioHub/AudioHub.debug.entitlements
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: AudioToolbox.framework

  AudioHubDriver:
    type: bundle
    platform: macOS
    sources:
      - path: virtual-device/AudioHubDriver/AudioHubDriver.c
    settings:
      base:
        PRODUCT_NAME: AudioHub
        WRAPPER_EXTENSION: driver
        PRODUCT_BUNDLE_IDENTIFIER: com.audiohub.virtual.driver
        INFOPLIST_FILE: virtual-device/AudioHubDriver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: mh_bundle
        CODE_SIGN_IDENTITY: "Developer ID Application"
        WARNING_CFLAGS: "-Wall -Wextra -Wno-unused-parameter"
        GCC_C_LANGUAGE_STANDARD: c11
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

schemes:
  AudioHub:
    build:
      targets:
        AudioHub: all
        AudioHubDriver: all
